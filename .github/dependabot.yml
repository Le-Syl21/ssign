version: 2

# Les actions tierces sont épinglées au SHA : un tag de version est mutable
# (en mars 2026, 76 des 77 tags de trivy-action ont été force-pushés vers du
# code malveillant), seul un SHA est immuable. La contrepartie, c'est qu'on ne
# reçoit plus les correctifs automatiquement — c'est le rôle de Dependabot, qui
# sait mettre à jour un SHA épinglé et garder le commentaire de version à jour.
updates:
  # Crates: one grouped PR a month for the routine bumps, and a separate PR
  # per major, so a breaking change never holds the rest of them hostage.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      # The RustCrypto crates move in lockstep or not at all: sha1 0.11 pulls
      # digest 0.11 while sha2 0.10 and hmac 0.12 are still on digest 0.10, and
      # the traits from the two digests do not match — `Hmac<Sha1>` stops being
      # `KeyInit`. Bumped one at a time they each fail to build; bumped together
      # they have a chance. One group, one PR.
      rustcrypto:
        patterns: ["digest", "sha1", "sha2", "sha3", "hmac", "md-5", "blake2",
                   "crypto-common", "block-buffer"]
      crates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
    ignore:
      # The RustCrypto 0.11 generation is out of reach until `rsa` gets there:
      # rsa 0.9.10, the latest stable, requires sha2 ^0.10.6 and digest ^0.10.5,
      # and only the unreleased 0.10.0-rc line moves to digest 0.11. Bump ours
      # anyway and the build stops at `sha2::Sha256: rsa::sha2::Digest` — two
      # digest generations in one graph — plus `Mac::new_from_slice` is gone
      # from hmac 0.13 (otp.rs). Patches are still welcome; the minor is not.
      # Lift this once rsa 0.10 ships stable.
      - dependency-name: sha1
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: sha2
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: hmac
        update-types: ["version-update:semver-minor", "version-update:semver-major"]


  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Une seule PR groupée plutôt qu'une par action.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    ignore:
      # dtolnay/rust-toolchain n'a pas de « versions » : la réf désigne le
      # toolchain Rust à installer. Dependabot la lisait comme un numéro de
      # version d'action et proposait @1.92 -> @1.100, ce qui viderait un job
      # MSRV de son sens (et 1.100 n'existe même pas). La version voulue vit
      # désormais dans `with: toolchain:`, hors de sa portée.
      - dependency-name: dtolnay/rust-toolchain
