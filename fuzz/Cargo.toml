[package]
name = "ssign-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ssign-core]
path = "../ssign-core"

# Its own workspace, so the fuzz crate and its nightly-only build never touch
# the project's.
[workspace]
members = ["."]

[[bin]]
name = "parsers"
path = "fuzz_targets/parsers.rs"
test = false
doc = false
bench = false
