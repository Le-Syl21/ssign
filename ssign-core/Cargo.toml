[package]
name = "ssign-core"
version = "0.1.8"
edition = "2021"
description = "The Certum SimplySign cloud-signing pipeline behind ssign: OAuth login, card/cert fetch, remote signature, and local Authenticode/PKCS#7 assembly — the reusable half shared by the ssign CLI and the ssign-pkcs11 module."
license = "MIT"
repository = "https://github.com/Le-Syl21/ssign"
homepage = "https://github.com/Le-Syl21/ssign"
documentation = "https://docs.rs/ssign-core"
readme = "../README.md"
keywords = ["authenticode", "code-signing", "certum", "simplysign", "pkcs11"]
categories = ["cryptography", "authentication"]
# Test fixtures (big binaries + a throwaway self-signed key) stay out of the
# published crate; src/certs/*.der is embedded code, so it stays.
exclude = ["tests/fixtures/*"]

[dependencies]
anyhow = "1"
base32 = "0.5"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
# `rustls` replaces 0.12's `rustls-tls`, and with it the trust anchors: 0.13
# verifies through `rustls-platform-verifier` (the OS store) instead of the
# Mozilla roots reqwest used to bundle. Upstream no longer wires
# `webpki-roots` in at all, so there is no bundled option to keep. It means
# ssign now honours a machine's own trust decisions -- and needs a trust
# store to exist, which a bare scratch container would not have.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "query", "cookies", "multipart", "rustls"] }
serde_json = "1"
regex = "1"
hex = "0.4"
cfb = "0.16"
uuid = "1"
x509-cert = "0.3"
der = { version = "0.8", features = ["pem"] }
zeroize = "1.9"
# Already in the tree through rustls.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys"] }

[dev-dependencies]
rsa = "0.10.0-rc.21"

[target.'cfg(unix)'.dependencies]
# geteuid, to refuse a session cache directory or file owned by another account.
libc = "0.2"
